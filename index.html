  <div class="foot">Rotaê · Informações atualizadas durante o acompanhamento.<br>Este link é pessoal. Não o compartilhe com terceiros.</div>
</main>
<script>
(()=>{'use strict';
 const SUPABASE_URL='https://qgxtcxxizsiclrmangjx.supabase.co';
 const PUBLIC_KEY='sb_publishable_8GaNTurif_JKbC056nDXMg_ZlV3Kn2W';
 const ENDPOINT=SUPABASE_URL+'/rest/v1/rpc/public_tracking';
 const get=id=>document.getElementById(id);
 const token=(new URLSearchParams(location.search)).get('track')||'';
 const states={pending:'Aguardando entregador',accepted:'Entregador a caminho',picked_up:'Saiu para entrega',delivered:'Entrega concluída',cancelled:'Entrega cancelada'};
 const progress=['pending','accepted','picked_up','delivered'];
 let refreshing=false, lastData=null;
 const el=(tag,className,text)=>{const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=String(text);return n};
 function showMessage(message){get('headline').textContent='Não foi possível acompanhar';get('subtitle').textContent='Confira o link recebido e tente novamente.';const wrap=el('div','error',message);get('main-panel').replaceChildren(wrap)}
 function statusNote(s){return ({pending:'Estamos procurando um entregador disponível.',accepted:'Um entregador aceitou a solicitação.',picked_up:'A encomenda foi retirada e está a caminho.',delivered:'A entrega foi confirmada.',cancelled:'A solicitação foi cancelada.'})[s]||'Consulte o andamento da entrega.'}
 function render(d){
  lastData=d;
  const s=d.status;
  get('headline').textContent=states[s]||'Atualização da entrega';get('subtitle').textContent=statusNote(s);
  const root=el('div');
  const pill=el('div','pill','Pedido #'+String(d.id||'—'));root.append(pill);
  const panel=el('section','panel');panel.append(el('h2','','Etapas do pedido'));
  const timeline=el('div','timeline');const ix=progress.indexOf(s);
  (s==='cancelled'?[...progress,'cancelled']:progress).forEach((step,i)=>{
   const active=(s==='cancelled'&&step==='cancelled')||(s===step);const completed=s==='cancelled'?false:i<ix;
   const row=el('div','step'+(active?' active':'')+(completed?' done':''));
   row.append(el('span','dot',completed?'✓':active?'•':''));
   const group=el('div');group.append(el('div','step-title',states[step]||step));
   if(active)group.append(el('div','step-note',statusNote(step)));
   row.append(group);timeline.append(row)
  });panel.append(timeline);root.append(panel);
  const details=el('section','panel');details.append(el('h2','','Detalhes básicos'));
  const info=el('div','info');
  for(const [label,value] of [['Destinatário',d.recipient_name],['Origem',d.pickup_address],['Cidade',d.city],['Entregador',d.driver_name||'Ainda não atribuído']]){
   if(!value)continue;const line=el('div','info-line');line.append(el('span','',label),el('strong','',value));info.append(line)
  }details.append(info);root.append(details);
  if(s==='picked_up' && /^\d{4,6}$/.test(String(d.delivery_pin||''))){
   const pin=el('section','pin');pin.append(el('div','caption','Código de confirmação'),el('div','number',d.delivery_pin),el('small','', 'Informe este código somente após receber sua encomenda. Não envie antes.'));
   root.append(pin)
  }else if(s!=='delivered' && s!=='cancelled'){
   root.append(el('div','note',s==='picked_up'?'Seu código ainda não está disponível. Entre em contato com o estabelecimento.':'O código de confirmação ficará disponível nesta página após a retirada.'))
  }
  const actions=el('div','actions');const btn=el('button','btn','Atualizar acompanhamento');btn.type='button';btn.onclick=refresh;actions.append(btn);root.append(actions);
  get('main-panel').replaceChildren(root)
 }
 async function refresh(){
  if(refreshing)return;refreshing=true;
  if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(token)){showMessage('Link de acompanhamento inválido. Solicite um novo link ao estabelecimento.');refreshing=false;return}
  const ctrl=new AbortController();const clock=setTimeout(()=>ctrl.abort(),11000);
  try{
   const resp=await fetch(ENDPOINT,{method:'POST',headers:{'apikey':PUBLIC_KEY,'Authorization':'Bearer '+PUBLIC_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token}),cache:'no-store',signal:ctrl.signal});
   const data=await resp.json().catch(()=>null);
   if(!resp.ok)throw new Error('A consulta falhou ('+resp.status+').');
   if(data===null){showMessage('Pedido não encontrado ou link expirado.');return}
   if(!data || typeof data!=='object' || !states[data.status])throw new Error('Os dados do pedido não estão disponíveis.');
   render(data)
  }catch(e){if(!lastData)showMessage('Não conseguimos consultar o pedido no momento. Confira a internet e tente novamente.');else get('subtitle').textContent='Sem conexão no momento. Última informação disponível.';}
  finally{clearTimeout(clock);refreshing=false}
 }
 refresh();setInterval(()=>{if(document.visibilityState==='visible' && lastData && !['delivered','cancelled'].includes(lastData.status))refresh()},20000);
})();
</script>
